name: CI

# RUNNER: Beast Gitea runner labels are ubuntu-latest / ubuntu-22.04 / ubuntu-20.04
# (Docker mode — fixed by Beast admin, cannot be changed). Workflows target ubuntu-22.04.
#
# Checkout: uses inline git rather than actions/checkout@v4 to bypass the act
# action-cache checksum corruption seen in prior Docker runs (task 2761, 2026-06-03).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        run: |
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraheader "Authorization: Bearer ${{ github.token }}"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: setup-pnpm
        run: npm install -g pnpm@11
      - name: install-deps
        run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json
      - name: review-guards
        run: |
          node scripts/checks/import-graph.mjs
          node scripts/checks/token-audit.mjs
      - name: build
        run: pnpm run build
      - name: check-exports
        run: node scripts/checks/check-exports.mjs
      - name: publish
        if: github.ref == 'refs/heads/main'
        env:
          GITEA_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "HOME=$HOME"
          id
          ls -la "$HOME" 2>/dev/null
          test -f "$HOME/.npmrc" && stat --format="%s bytes" "$HOME/.npmrc" || echo "no .npmrc yet"
          test -d "$HOME" && echo "HOME writable: $(touch "$HOME/test_write" 2>&1 && rm "$HOME/test_write" && echo yes || echo no)"
          echo "publish token length: $(echo -n "$GITEA_TOKEN" | wc -c) chars"
          echo "//gitea.beast.ruun.network/api/packages/K-W/npm/:_authToken=${GITEA_TOKEN}" >> "${HOME}/.npmrc"
          echo "npmrc file bytes after write: $(wc -c < "${HOME}/.npmrc")"
          pnpm publish --access public --no-git-checks
