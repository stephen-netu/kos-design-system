name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: install-deps
        run: npm ci
      - name: svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: build
        run: npm run build
      - name: publish
        if: github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
          npx changeset publish
