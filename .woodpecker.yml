when:
  branch: main
  event: [push, manual]

steps:
  install:
    image: node:20
    commands:
      - corepack enable
      - corepack prepare pnpm@latest --activate
      - pnpm install --frozen-lockfile

  check:
    image: node:20
    commands:
      - corepack enable
      - corepack prepare pnpm@latest --activate
      - pnpm check

  release:
    image: node:20
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - corepack enable
      - corepack prepare pnpm@latest --activate
      - pnpm build
      - npm version patch --no-git-tag-version
      - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
      - npm publish --access public