name: CI

# RUNNER: Beast Gitea runner labels are ubuntu-latest / ubuntu-22.04 / ubuntu-20.04
# (Docker mode — fixed by Beast admin, cannot be changed). Workflows target ubuntu-22.04.
#
# Checkout: uses inline git rather than actions/checkout@v4 to bypass the act
# action-cache checksum corruption seen in prior Docker runs (task 2761, 2026-06-03).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        run: |
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraheader "Authorization: Bearer ${{ github.token }}"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: setup-pnpm
        run: npm install -g pnpm@11
      - name: install-deps
        run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json
      - name: review-guards
        run: |
          node scripts/checks/import-graph.mjs
          node scripts/checks/token-audit.mjs
      - name: build
        run: pnpm run build
      - name: check-exports
        run: node scripts/checks/check-exports.mjs
      # NO PUBLISH STEP — this is intentional, do not re-add one.
      #
      # Releases are published to npmjs.org from GitHub Actions via trusted
      # publishing (OIDC): see .github/workflows/release.yml. npm's trusted
      # publishing does not support self-hosted runners, so the Beast runner
      # cannot mint the credential; and long-lived npm tokens are being retired
      # (bypass-2FA tokens lose direct publishing around Jan 2027).
      #
      # This repo previously published to the Gitea npm registry, which left
      # npmjs stuck at 0.2.2 while Gitea carried 0.3.0-0.5.0 — two registries
      # with disjoint contents, and consumers pointed at whichever one could not
      # serve them. npmjs is now the single registry for this package.
      #
      # The Gitea secret NPM_DESIGN_SYSTEM is no longer used and can be revoked.
